<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      const staffPaths = ["/staff", "/staff-login", "/admin", "/responder"];
      const isStaffApp = staffPaths.some((path) => window.location.pathname.startsWith(path));
      const manifest = document.createElement("link");
      manifest.rel = "manifest";
      manifest.href = isStaffApp ? "/manifest-staff.webmanifest" : "/manifest-requester.webmanifest";
      document.head.appendChild(manifest);
    </script>
    <title>frontend</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
